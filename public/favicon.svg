<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#F5E6C8"/>
  <g transform="translate(16,16)">
    <!-- 8 outer petals (terracotta) — 4 ellipses × 2 ends each -->
    <ellipse rx="2.5" ry="6.5" fill="#C67B5C" opacity="0.82"/>
    <ellipse rx="2.5" ry="6.5" fill="#C67B5C" opacity="0.82" transform="rotate(45)"/>
    <ellipse rx="2.5" ry="6.5" fill="#C67B5C" opacity="0.82" transform="rotate(90)"/>
    <ellipse rx="2.5" ry="6.5" fill="#C67B5C" opacity="0.82" transform="rotate(135)"/>
    <!-- 8 inner petals (blush) — offset 22.5° -->
    <ellipse rx="1.8" ry="4.5" fill="#E8B4B8" opacity="0.88" transform="rotate(22.5)"/>
    <ellipse rx="1.8" ry="4.5" fill="#E8B4B8" opacity="0.88" transform="rotate(67.5)"/>
    <ellipse rx="1.8" ry="4.5" fill="#E8B4B8" opacity="0.88" transform="rotate(112.5)"/>
    <ellipse rx="1.8" ry="4.5" fill="#E8B4B8" opacity="0.88" transform="rotate(157.5)"/>
    <!-- Center -->
    <circle r="3.2" fill="#D4A574"/>
    <circle r="1.8" fill="#C67B5C"/>
    <circle r="0.8" fill="#F5E6C8"/>
  </g>
</svg>
